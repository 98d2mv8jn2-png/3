<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>財務士高班第二階段測驗系統</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #15803d;
            --danger: #b91c1c;
            --warning: #d97706;
            --purple: #6366f1;
            --purple-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }
        body.dark-mode {
            --primary: #60a5fa;
            --primary-hover: #93c5fd;
            --primary-light: #1e293b;
            --success: #4ade80;
            --danger: #f87171;
            --warning: #fbbf24;
            --purple: #a78bfa;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 15px -1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 720px;
            padding: 2rem;
            position: relative;
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }
        h1 { font-size: 1.3rem; color: var(--primary); margin-bottom: 1rem; text-align: center; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.15rem;
        }
        .dash-card {
            background: var(--primary-light);
            border-radius: 8px;
            padding: 0.6rem 0.4rem;
            text-align: center;
            border: 1px solid var(--border);
        }
        .dash-title { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        .dash-val { font-size: 1.05rem; font-weight: 800; color: var(--primary); }
        .dash-bar-bg { background: var(--border); height: 5px; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .dash-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        
        .setup-group { margin-bottom: 1.15rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.45rem; font-size: 0.95rem; }
        select, input[type="number"], textarea {
            width: 100%;
            padding: 0.7rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text);
            user-select: text;
            -webkit-user-select: text;
        }
        select:focus, input[type="number"]:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 110px; font-family: inherit; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem; }
        .grid-item label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .range-inputs { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .range-inputs input { width: 50%; }
        .total-hint { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 0.4rem; text-align: right; }
        
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
            padding: 0.7rem 1.25rem;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        .btn-warning { background-color: var(--warning); color: #fff; }
        .btn-secondary { background-color: var(--text-muted); color: #fff; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-purple { background-color: var(--purple); color: #fff; }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-text-sm {
            background: none;
            border: none;
            color: #0284c7;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem;
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 20px;
        }
        .quiz-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .quiz-topbar-right { display: flex; align-items: center; gap: 0.75rem; }
        .mastered-toggle {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }
        .mastered-toggle input { cursor: pointer; width: 16px; height: 16px; }
        
        .pause-banner {
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.15rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            color: #78350f;
        }
        .pause-title { font-weight: bold; font-size: 0.9rem; }
        .pause-desc { font-size: 0.82rem; }
        .pause-btns { display: flex; gap: 0.5rem; }

        .question-box { font-size: 1.05rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.6; }
        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 6px; }
        .feedback.correct { background-color: #dcfce7; border: 1px solid #bbf7d0; color: var(--success); }
        .feedback.wrong { background-color: #fee2e2; border: 1px solid #fecaca; color: var(--danger); }
        .feedback-title { font-weight: bold; font-size: 1rem; margin-bottom: 0.4rem; }
        .diff-view { background: var(--card-bg); border: 1px solid var(--border); padding: 0.75rem; border-radius: 4px; margin-top: 0.5rem; font-size: 0.92rem; line-height: 1.6; word-break: break-all; }
        
        .card-stage {
            position: relative;
            width: 100%;
            height: 390px;
            margin: 0.5rem 0 1rem 0;
            perspective: 1200px;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            will-change: transform;
            transform-origin: center center;
        }
        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 16px;
            pointer-events: none;
        }
        .flashcard-inner.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            border: 2px solid var(--border);
            background-color: var(--card-bg);
            pointer-events: auto;
        }
        .flashcard-front { border-color: #93c5fd; }
        .flashcard-back { transform: rotateY(180deg); border-color: #86efac; background-color: var(--primary-light); }
        .flashcard-side-label { font-size: 0.8rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .flashcard-body {
            flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 0.96rem; line-height: 1.6; font-weight: 600; overflow-y: auto; padding: 0.4rem 0.5rem; word-break: break-word; user-select: text; -webkit-user-select: text;
        }
        .flashcard-back .flashcard-body { font-weight: 500; }
        .flashcard-hint { font-size: 0.78rem; color: var(--text-muted); text-align: center; user-select: none; flex-shrink: 0; margin-top: 0.25rem; }

        .ergonomic-bar {
            display: flex; align-items: center; justify-content: space-between; background: var(--card-bg);
            border: 1.5px solid var(--border); padding: 0.45rem 0.6rem; border-radius: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-top: 0.35rem;
        }
        .ergo-btn-circle {
            width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--primary-light); color: var(--text);
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.15s; flex-shrink: 0;
        }
        .ergo-btn-circle:active { transform: scale(0.9); }
        .ergo-btn-circle:disabled { opacity: 0.4; cursor: not-allowed; }
        .ergo-btn-center {
            flex-grow: 1; margin: 0 0.5rem; height: 46px; border-radius: 25px; border: none;
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: #fff; font-size: 0.95rem; font-weight: 700;
            display: flex; justify-content: center; align-items: center; gap: 0.35rem; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .ergo-btn-autoplay {
            height: 46px; padding: 0 0.9rem; border-radius: 25px; border: 1.5px solid var(--border); background: var(--card-bg);
            color: var(--text-muted); font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 0.3rem; cursor: pointer; flex-shrink: 0;
        }
        .ergo-btn-autoplay.active { background: #fef3c7; border-color: #f59e0b; color: #b45309; }

        .diff-tag { font-size: 0.75rem; padding: 2px 7px; border-radius: 6px; font-weight: 700; }
        .diff-tag-easy { background-color: #dcfce7; color: #166534; }
        .diff-tag-mid { background-color: #fef3c7; color: #92400e; }
        .diff-tag-hard { background-color: #fee2e2; color: #991b1b; }
        
        .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .filter-tab {
            padding: 0.35rem 0.8rem; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg);
            font-size: 0.85rem; cursor: pointer; color: var(--text-muted); font-weight: 600;
        }
        .filter-tab.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }
        .mastered-list { max-height: 55vh; overflow-y: auto; margin: 0.5rem 0 1rem 0; display: flex; flex-direction: column; gap: 0.75rem; }
        .mastered-item-card { border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem; background: var(--card-bg); }
        .mastered-item-card.is-mastered { border-color: #93c5fd; background-color: var(--primary-light); }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 1.5rem;
        }
        .modal-card { background: var(--card-bg); border-radius: 16px; max-width: 500px; width: 100%; padding: 2rem; text-align: center; color: var(--text); }
        .hidden { display: none !important; }
        
        @media print {
            body { background: #fff; color: #000; padding: 0; }
            .container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
            .no-print, button, .filter-tabs, .quiz-topbar { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 主頁（設定與總覽） -->
    <div id="view-setup">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <button class="btn-text-sm" onclick="toggleDarkMode()">🌓 切換夜間護眼模式</button>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="study-streak-badge">🔥 連續學習 0 天</div>
        </div>
        <h1>財務士高班第二階段測驗</h1>
        
        <!-- 掌握度儀表板 -->
        <div class="dashboard-grid">
            <div class="dash-card">
                <div class="dash-title">總熟記率</div>
                <div class="dash-val" id="dash-total">0/90</div>
                <div class="dash-bar-bg"><div class="dash-bar-fill" id="dash-bar-total"></div></div>
            </div>
            <div class="dash-card">
                <div class="dash-title">易題 (36)</div>
                <div class="dash-val" id="dash-easy">0/36</div>
                <div class="dash-bar-bg"><div class="dash-bar-fill" id="dash-bar-easy" style="background:#15803d;"></div></div>
            </div>
            <div class="dash-card">
                <div class="dash-title">中題 (36)</div>
                <div class="dash-val" id="dash-mid">0/36</div>
                <div class="dash-bar-bg"><div class="dash-bar-fill" id="dash-bar-mid" style="background:#d97706;"></div></div>
            </div>
            <div class="dash-card">
                <div class="dash-title">難題 (18)</div>
                <div class="dash-val" id="dash-hard">0/18</div>
                <div class="dash-bar-bg"><div class="dash-bar-fill" id="dash-bar-hard" style="background:#b91c1c;"></div></div>
            </div>
        </div>

        <!-- 進行中進度恢復提示面板 -->
        <div id="panel-paused-quiz" class="pause-banner hidden">
            <div class="pause-title">📌 偵測到有尚未完成的測驗進度</div>
            <div class="pause-desc" id="pause-status-desc">目前進度：第 1 題 / 共 30 題</div>
            <div class="pause-btns">
                <button class="btn btn-success" onclick="resumeQuiz()" style="font-size:0.85rem; padding:0.4rem 0.8rem;">▶️ 繼續未完成測驗</button>
                <button class="btn btn-secondary" onclick="discardQuiz()" style="font-size:0.85rem; padding:0.4rem 0.8rem;">放棄進度</button>
            </div>
        </div>

        <div class="setup-group">
            <label for="select-mode">題目範圍與抽題模式：</label>
            <select id="select-mode" onchange="handleModeChange()">
                <option value="ratio" selected>依難易度配題（預設 15/10/5，含熟記題）</option>
                <option value="all">全題庫隨機抽取（直接跳過已熟記題）</option>
                <option value="custom">自訂指定題號區間（直接跳過已熟記題）</option>
            </select>
        </div>

        <!-- 難度自訂面板 -->
        <div id="panel-ratio" class="setup-group">
            <label>設定各難度題數：</label>
            <div class="grid-inputs">
                <div class="grid-item">
                    <label for="input-easy">易（上限 36）</label>
                    <input type="number" id="input-easy" min="0" max="36" value="15" oninput="updateTotalCount()">
                </div>
                <div class="grid-item">
                    <label for="input-mid">中（上限 36）</label>
                    <input type="number" id="input-mid" min="0" max="36" value="10" oninput="updateTotalCount()">
                </div>
                <div class="grid-item">
                    <label for="input-hard">難（上限 18）</label>
                    <input type="number" id="input-hard" min="0" max="18" value="5" oninput="updateTotalCount()">
                </div>
            </div>
            <div class="total-hint" id="ratio-total-hint">本次預計：30 題</div>
        </div>

        <!-- 隨機抽取題數 -->
        <div id="panel-count" class="setup-group hidden">
            <label for="input-count" id="label-count">本次抽取題數：</label>
            <input type="number" id="input-count" min="1" max="90" value="30">
        </div>

        <!-- 自訂區間 -->
        <div id="panel-custom" class="setup-group hidden">
            <label>指定題庫索引區間：</label>
            <div class="range-inputs">
                <input type="number" id="custom-start" min="1" max="90" value="1" placeholder="起始題號">
                <span>至</span>
                <input type="number" id="custom-end" min="1" max="90" value="90" placeholder="結束題號">
            </div>
        </div>

        <div class="setup-group" id="group-match-rule">
            <label for="select-match-rule">打字答案判定規則：</label>
            <select id="select-match-rule">
                <option value="smart" selected>💡 寬鬆模式（要點正確即可，免編號標點、順序不拘）</option>
                <option value="exact">🎯 嚴格模式（一字不漏，含編號/順序/標點；全半形皆可）</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.25rem;">
            <button class="btn" id="btn-start-quiz" type="button">✍️ 開始打字測驗</button>
            <button class="btn btn-purple" id="btn-open-flashcard" type="button">🎴 進入智慧字卡</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem;">
            <button class="btn-text-sm" id="btn-show-mastered" type="button">📖 總題庫瀏覽 / 列印</button>
            <div>
                <button class="btn-text-sm" id="btn-show-backup" type="button">💾 進度備份</button>
                <span style="color: var(--border); margin: 0 4px;">|</span>
                <button class="btn-text-sm" style="color: var(--danger);" id="btn-reset-data" type="button">⚠️ 清空資料</button>
            </div>
        </div>
    </div>

    <!-- 總題庫瀏覽與管理畫面 -->
    <div id="view-mastered" class="hidden">
        <div class="quiz-topbar">
            <h1>總題庫瀏覽與管理</h1>
            <button class="btn btn-secondary no-print" onclick="window.print()" style="width:auto; padding:0.4rem 0.8rem; font-size:0.85rem;">🖨️ 列印此清單</button>
        </div>
        <div class="filter-tabs no-print">
            <button class="filter-tab active" id="tab-all" onclick="switchBankFilter('all')">全部 (90)</button>
            <button class="filter-tab" id="tab-unmastered" onclick="switchBankFilter('unmastered')">未熟記</button>
            <button class="filter-tab" id="tab-mastered" onclick="switchBankFilter('mastered')">已熟記</button>
        </div>
        <div id="mastered-list-container" class="mastered-list"></div>
        <button class="btn btn-secondary no-print" id="btn-hide-mastered" type="button" style="margin-top: 1rem;">返回主頁</button>
    </div>

    <!-- 打字測驗畫面 -->
    <div id="view-quiz" class="hidden">
        <div class="quiz-topbar">
            <div class="status-badge" id="quiz-progress">第 1 題 / 共 30 題</div>
            <div class="quiz-topbar-right">
                <label class="mastered-toggle">
                    <input type="checkbox" id="chk-mastered" onchange="toggleMastered(this.checked)">
                    <span>熟記</span>
                </label>
                <button class="btn-text-sm" id="btn-pause-quiz" type="button" style="font-weight:600; color:var(--text-muted);">⏸️ 暫停回主頁</button>
            </div>
        </div>
        
        <div class="question-box" id="quiz-question"></div>
        <textarea id="quiz-answer" placeholder="請輸入答案..." oninput="saveCurrentDraft(this.value)"></textarea>
        
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
            <button class="btn btn-secondary" id="btn-prev" style="width: auto; min-width: 95px;">⬅️ 上一題</button>
            <button class="btn btn-skip hidden" id="btn-skip">⏭️ 熟記跳過</button>
            <button class="btn" id="btn-submit">提交答案</button>
            <button class="btn btn-success hidden" id="btn-next">下一題 ➡️</button>
        </div>

        <div id="quiz-feedback" class="feedback hidden"></div>
    </div>

    <!-- 🎴 智慧字卡背誦畫面 (具備 SRS 智慧演算法) -->
    <div id="view-flashcard" class="hidden">
        <div class="quiz-topbar">
            <select id="select-card-scope" style="width:auto; padding:0.3rem 0.6rem; font-size:0.85rem; font-weight:700; border-radius:20px; border-color:#c7d2fe; background:var(--primary-light); color:var(--primary); outline:none; cursor:pointer;" onchange="changeCardScope(this.value)">
                <option value="unmastered" selected>📚 僅未熟記題庫</option>
                <option value="all">🌐 全部總題庫 (90題)</option>
                <option value="srs-smart" style="color:#b45309; font-weight:bold;">🧠 SRS 智慧演算法複習（自動優先複習錯題）</option>
                <option value="easy">🟢 僅「易」題 (36題)</option>
                <option value="mid">🟡 僅「中」題 (36題)</option>
                <option value="hard">🔴 僅「難」題 (18題)</option>
            </select>
            
            <div class="quiz-topbar-right">
                <button class="btn-text-sm" id="btn-card-restart" type="button" style="font-weight:700; color:var(--warning);" title="回到第一題">🔄 重新開始</button>

    { id: 1, diff: "easy", q: "依決算法第26及28條規定，審計長應於中央政府總決算送達後幾個月內完成審核報告送立法院？立法院應於多久內完成審議？如未完成，視同審議通過。", a: "(1)3個月。(2)1年。" },
    { id: 2, diff: "easy", q: "依據國軍各級單位額定零用金作業規定，國防經費零用金每筆支出上限，額度為多少？", a: "2萬。" },
    { id: 3, diff: "easy", q: "三節加菜金為哪三節？給與為多少？", a: "春節、端節、秋節；50元。" },

    { id: 5, diff: "easy", q: "依國軍代收款處理規定，款項之收付保管，應按何原則辦理？代收款收支計畫其個案金額在多少元（含）以上者，應報國防部核定？", a: "(1)依統收統支原則，由各地區財務單位統一辦理。(2)1,000萬。" },
    { id: 6, diff: "easy", q: "依跨機關通報國軍人員申請婚生喪殮補助服務要點，無須補證案件部分，申請人於戶政事務所辦理戶籍登記及完成通報後，即完成申請，可申請補助費計有哪幾項？", a: "(1)結婚補助費。(2)父母（配偶、子女）喪葬補助費。" },
    { id: 7, diff: "easy", q: "依國軍各單位預算簿籍憑證保管期限參照表，各部隊（含外島單位）憑證自總決算公布日起，保存幾年？帳籍自總決算公布日起，保存幾年？", a: "(1)憑證：2年。(2)帳籍：2年6個月。" },
    { id: 8, diff: "easy", q: "依國軍各單位預算簿籍憑證保管期限參照表，本島各機關學校帳籍自總決算公布日起，保存幾年？", a: "5年。" },
    { id: 9, diff: "easy", q: "國軍以單位領據結報之各項經費項目為何？", a: "(1)定額行政事務費。(2)部隊特別補助費。(3)保密科目經費。" },
    { id: 10, diff: "easy", q: "依預算法第6條，何謂歲出預算？", a: "謂一個會計年度之一切支出。但不包括債務之償還。" },
    { id: 11, diff: "easy", q: "依預算法第10條規定，歲入、歲出預算，按其收支性質區分為那兩類？", a: "經常門、資本門。" },
    { id: 12, diff: "easy", q: "依預算法第37條規定，各機關單位預算，歲入應按何種科目編製？歲出應按何種科目編製之？", a: "(1)來源別。(2)政事別、計畫或業務別與用途別。" },

    { id: 14, diff: "easy", q: "依國防部與所屬各級單位主官及副主官特別費行政費管制措施規定第3條，上校及中校主官、副主官每月列支額度為何？", a: "(1)上校：6,600元。(2)中校：5,100元。" },

    { id: 17, diff: "easy", q: "依國軍各單位經管款項存款帳戶管制規定第3條及第4條，開戶時機為何？", a: "新單位奉核定編成、駐地變更、奉撥專款。" },

    { id: 19, diff: "easy", q: "試舉主副食費支出項目5項？", a: "(1)各旬菜金。(2)止伙費。(3)炊具費。(4)副食外購。(5)瓦斯費。" },

    { id: 22, diff: "easy", q: "主計部門及伙委所掌管「伙食費款收支登記表」其帳務以何方式為會計基礎辦理？", a: "(1)現金收付實現制。(2)權責發生制。" },
    { id: 23, diff: "easy", q: "本島一般部隊每月副食外購比例為副食分之幾？", a: "20%。" },

    { id: 25, diff: "easy", q: "依官兵薪餉自由選擇薪資存款業務金融機構計有哪4家？", a: "(1)郵局。(2)土地銀行。(3)合作金庫銀行。(4)台新銀行。" },
    { id: 26, diff: "easy", q: "依國軍各單位預算簿籍憑證保管期限參照表，本島各機關學校憑證自總決算公布日起，保存幾年？", a: "2年。" },
    { id: 27, diff: "easy", q: "何謂主計人員？", a: "辦理單位主辦主計（會計）人員及所屬承辦主計事務人員謂之。" },
    { id: 28, diff: "easy", q: "依國軍各級單位現金會計作業規定第30條，有關業務部門簽借墊借款應預定歸還期限，無論預算是否獲得，應於取得單據或任務結束後多少日內辦理核銷歸墊？", a: "30日內。" },
    { id: 29, diff: "easy", q: "依國軍各級單位現金會計作業規定第32條第6項，伙食團於何種情況下須歸還副食週轉金？", a: "年度結束時歸還。" },

    { id: 31, diff: "easy", q: "依國防部及所屬各機關（構）獎金核發作業規定劃分，中校核給個人獎金上限為多少？", a: "1,000元。" },

    { id: 33, diff: "easy", q: "依預算法第51條規定，總預算案應於會計年度開始前多久由立法院議決？", a: "前1個月。" },
    { id: 34, diff: "easy", q: "依預算法第51條規定，總預算案應於會計年度開始前幾日由總統公布？", a: "前15天。" },
    { id: 35, diff: "easy", q: "依會計法第109條，各機關經管現金、票據，證券、財物或其他資產，如有遺失、毀損，或因其他意外事故而致損失者，應檢同有關證件，報何機關審核？", a: "審計機關。" },
    { id: 36, diff: "easy", q: "依陸軍單位代管現金作業應行注意事項，收受代管現金應以何會計科目收帳？", a: "2406特定業務專案經費。" },

    { id: 39, diff: "mid", q: "依軍費預算執行及支付結報規定第8條第3項，自辦理暫付之日起，最遲不得超過幾天？", a: "其結報期限，自辦理暫付之日起，除外購案預付款等無法取得憑證結報者外，最遲不得超過四十五天（含例假日）。" },

    { id: 41, diff: "mid", q: "國軍計畫預算制度之特性？", a: "(1)著重遠程規劃。(2)考量整體發展。(3)實施整合評估。(4)確立計畫結構。(5)強化授權加責。(6)建立單位成本。(7)運用資訊系統。" },
    { id: 42, diff: "mid", q: "人事薪給資料查核時機為何？", a: "(1)支薪單位人員異動。(2)支薪單位編制修訂。(3)每半年實施人事薪給資料查核乙次。" },

    { id: 45, diff: "mid", q: "國軍施政計畫結構，係以國軍兵力體系與業務系統，依任務區分，請問第1至4個計畫為何？", a: "(1)作戰部隊。(2)預備及後備部隊。(3)後勤支援。(4)政治作戰。" },

    { id: 48, diff: "mid", q: "依預算法第16條規定，預算區分為幾種？", a: "總預算、單位預算、單位預算之分預算、附屬單位預算、附屬單位預算之分預算。" },

let masteredSet = new Set();
let wrongStats = {};
let cardLastPositions = {};
let streakData = { days: 0, lastDate: "" };

try {
    masteredSet = new Set(JSON.parse(localStorage.getItem('mastered_questions_stage2') || '[]'));
    wrongStats = JSON.parse(localStorage.getItem('wrong_stats_stage2') || '{}');
    cardLastPositions = JSON.parse(localStorage.getItem('card_last_positions_stage2') || '{}');
    streakData = JSON.parse(localStorage.getItem('study_streak_data_stage2') || '{"days":0, "lastDate":""}');
} catch (e) {
    localStorage.clear();
}

function updateStudyStreak() {
    const todayStr = new Date().toISOString().slice(0, 10);
    if (streakData.lastDate === todayStr) return;

    if (!streakData.lastDate) {
        streakData.days = 1;
        streakData.lastDate = todayStr;
    } else {
        const lastDateObj = new Date(streakData.lastDate);
        const todayObj = new Date(todayStr);
        const diffDays = Math.round((todayObj - lastDateObj) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
            streakData.days += 1;
            streakData.lastDate = todayStr;
        } else if (diffDays > 1) {
            streakData.days = 1;
            streakData.lastDate = todayStr;
        }
    }
    try {
        localStorage.setItem('study_streak_data_stage2', JSON.stringify(streakData));
    } catch (e) {}
}

function renderStreakBadge() {
    updateStudyStreak();
    const badge = document.getElementById('study-streak-badge');
    if (badge) badge.textContent = `🔥 連續學習 ${streakData.days || 1} 天`;
}

function renderDashboard() {
    const totalM = masteredSet.size;
    const easyM = RAW_QUESTIONS.filter(q => q.diff === 'easy' && masteredSet.has(q.id)).length;
    const midM = RAW_QUESTIONS.filter(q => q.diff === 'mid' && masteredSet.has(q.id)).length;
    const hardM = RAW_QUESTIONS.filter(q => q.diff === 'hard' && masteredSet.has(q.id)).length;

    const elTotal = document.getElementById('dash-total');
    if (elTotal) elTotal.textContent = `${totalM}/90`;
    const elEasy = document.getElementById('dash-easy');
    if (elEasy) elEasy.textContent = `${easyM}/36`;
    const elMid = document.getElementById('dash-mid');
    if (elMid) elMid.textContent = `${midM}/36`;
    const elHard = document.getElementById('dash-hard');
    if (elHard) elHard.textContent = `${hardM}/18`;

    const barT = document.getElementById('dash-bar-total');
    if (barT) barT.style.width = `${(totalM/90)*100}%`;
    const barE = document.getElementById('dash-bar-easy');
    if (barE) barE.style.width = `${(easyM/36)*100}%`;
    const barM = document.getElementById('dash-bar-mid');
    if (barM) barM.style.width = `${(midM/36)*100}%`;

    if (barH) barH.style.width = `${(hardM/18)*100}%`;
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('dark_mode_enabled_stage2', document.body.classList.contains('dark-mode'));
}

if (localStorage.getItem('dark_mode_enabled_stage2') === 'true') {
    document.body.classList.add('dark-mode');
}

function handleModeChange() {
    const modeEl = document.getElementById('select-mode');
    if (!modeEl) return;
    const mode = modeEl.value;
    const pRatio = document.getElementById('panel-ratio');
    const pCount = document.getElementById('panel-count');
    const pCustom = document.getElementById('panel-custom');

    if (pRatio) pRatio.classList.add('hidden');
    if (pCount) pCount.classList.add('hidden');
    if (pCustom) pCustom.classList.add('hidden');

    if (mode === 'ratio' && pRatio) {
        pRatio.classList.remove('hidden');
        updateTotalCount();
    } else if (mode === 'all' && pCount) {
        pCount.classList.remove('hidden');
        const unmasteredTotal = RAW_QUESTIONS.length - masteredSet.size;
        const labelC = document.getElementById('label-count');
        if (labelC) labelC.textContent = `本次抽取題數 (排除熟記後共 ${unmasteredTotal} 題)：`;
    } else if (mode === 'custom' && pCustom) {
        pCustom.classList.remove('hidden');
    }
}

function updateTotalCount() {
    const e = parseInt(document.getElementById('input-easy')?.value || 0, 10);
    const m = parseInt(document.getElementById('input-mid')?.value || 0, 10);
    const h = parseInt(document.getElementById('input-hard')?.value || 0, 10);
    const hint = document.getElementById('ratio-total-hint');
    if (hint) hint.textContent = `本次預計：${e + m + h} 題`;
}

function getRandomSubarray(arr, size) {
    const shuffled = [...arr].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, size);
}

function getSelectedPool() {
    const mode = document.getElementById('select-mode').value;
    let selected = [];

    if (mode === 'ratio') {
        const easyCount = Math.min(Math.max(0, parseInt(document.getElementById('input-easy').value, 10) || 0), 36);
        const midCount = Math.min(Math.max(0, parseInt(document.getElementById('input-mid').value, 10) || 0), 36);
        const hardCount = Math.min(Math.max(0, parseInt(document.getElementById('input-hard').value, 10) || 0), 18);

        selected = [
            ...getRandomSubarray(RAW_QUESTIONS.filter(x => x.diff === 'easy'), easyCount),
            ...getRandomSubarray(RAW_QUESTIONS.filter(x => x.diff === 'mid'), midCount),
            ...getRandomSubarray(RAW_QUESTIONS.filter(x => x.diff === 'hard'), hardCount)
        ];
    } else if (mode === 'all') {
        const unmasteredPool = RAW_QUESTIONS.filter(x => !masteredSet.has(x.id));
        if (unmasteredPool.length === 0) {
            alert("🎉 所有題目均已熟記！");
            return null;
        }
        const count = Math.min(Math.max(1, parseInt(document.getElementById('input-count').value, 10) || 1), unmasteredPool.length);
        selected = getRandomSubarray(unmasteredPool, count);
    } else if (mode === 'custom') {
        let start = (parseInt(document.getElementById('custom-start').value, 10) || 1);
        let end = (parseInt(document.getElementById('custom-end').value, 10) || 90);
        if (start > end) [start, end] = [end, start];
        selected = RAW_QUESTIONS.filter(q => q.id >= start && q.id <= end && !masteredSet.has(q.id));
        if (selected.length === 0) {
            alert(`題號 ${start} 至 ${end} 區間題目已全數熟記！`);
            return null;
        }
    }
    return selected;
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ✍️ 打字測驗邏輯（支援暫停與繼續進度） */
function startQuiz() {
    activeMatchRule = document.getElementById('select-match-rule').value;
    const selected = getSelectedPool();
    if (!selected || selected.length === 0) return;

    quizList = selected.sort(() => 0.5 - Math.random());
    userAnswers = new Array(quizList.length).fill(null);
    currentIndex = 0;
    isQuizActive = true;
    saveQuizSession();

    document.getElementById('view-setup').classList.add('hidden');
    document.getElementById('view-result').classList.add('hidden');
    document.getElementById('view-mastered').classList.add('hidden');
    document.getElementById('view-flashcard').classList.add('hidden');
    document.getElementById('view-quiz').classList.remove('hidden');

    showQuestion();
}

function saveQuizSession() {
    if (!isQuizActive) {
        localStorage.removeItem('quiz_session_stage2');
        renderPauseBanner();
        return;
    }
    const session = { quizList, userAnswers, currentIndex, activeMatchRule };
    localStorage.setItem('quiz_session_stage2', JSON.stringify(session));
    renderPauseBanner();
}

function renderPauseBanner() {
    const raw = localStorage.getItem('quiz_session_stage2');
    const banner = document.getElementById('panel-paused-quiz');
    if (!banner) return;
    if (raw) {
        try {
            const session = JSON.parse(raw);
            if (session.quizList && session.quizList.length > 0) {
                banner.classList.remove('hidden');
                document.getElementById('pause-status-desc').textContent = `目前進度：第 ${session.currentIndex + 1} 題 / 共 ${session.quizList.length} 題`;
                return;
            }
        } catch(e) {}
    }
    banner.classList.add('hidden');
}

function resumeQuiz() {
    const raw = localStorage.getItem('quiz_session_stage2');
    if (!raw) return;
    try {
        const session = JSON.parse(raw);
        quizList = session.quizList;
        userAnswers = session.userAnswers;
        currentIndex = session.currentIndex;
        activeMatchRule = session.activeMatchRule || 'smart';
        isQuizActive = true;

        document.getElementById('view-setup').classList.add('hidden');
        document.getElementById('view-result').classList.add('hidden');
        document.getElementById('view-mastered').classList.add('hidden');
        document.getElementById('view-flashcard').classList.add('hidden');
        document.getElementById('view-quiz').classList.remove('hidden');

        showQuestion();
    } catch(e) {
        localStorage.removeItem('quiz_session_stage2');
        renderPauseBanner();
    }
}

function discardQuiz() {
    if (confirm("確定要放棄目前的測驗進度嗎？")) {
        isQuizActive = false;
        localStorage.removeItem('quiz_session_stage2');
        renderPauseBanner();
    }
}

function pauseAndGoHome() {
    saveQuizSession();
    document.getElementById('view-quiz').classList.add('hidden');
    document.getElementById('view-setup').classList.remove('hidden');
    renderPauseBanner();
}

function showQuestion() {
    const item = quizList[currentIndex];
    const record = userAnswers[currentIndex];

    document.getElementById('quiz-progress').textContent = `第 ${currentIndex + 1} 題 / 共 ${quizList.length} 題`;
    document.getElementById('quiz-question').textContent = `(#${item.id}) ${item.q}`;

    const btnPrev = document.getElementById('btn-prev');
    if (btnPrev) btnPrev.disabled = (currentIndex === 0);

    const isMastered = masteredSet.has(item.id);
    const chkMastered = document.getElementById('chk-mastered');
    if (chkMastered) chkMastered.checked = isMastered;

    const skipBtn = document.getElementById('btn-skip');
    const ansArea = document.getElementById('quiz-answer');
    const submitBtn = document.getElementById('btn-submit');
    const nextBtn = document.getElementById('btn-next');
    const feedback = document.getElementById('quiz-feedback');

    if (record && record.isSubmitted) {
        ansArea.value = record.userAnswer || '';
        ansArea.disabled = true;
        if (submitBtn) submitBtn.classList.add('hidden');
        if (skipBtn) skipBtn.classList.add('hidden');
        if (nextBtn) nextBtn.classList.remove('hidden');
        if (feedback) {
            feedback.className = `feedback ${record.isCorrect ? 'correct' : 'wrong'}`;
            feedback.innerHTML = record.feedbackHtml;
            feedback.classList.remove('hidden');
        }
    } else {
        ansArea.value = (record && record.userAnswer) ? record.userAnswer : '';
        ansArea.disabled = false;
        if (submitBtn) submitBtn.classList.remove('hidden');
        if (nextBtn) nextBtn.classList.add('hidden');
        if (feedback) feedback.className = 'feedback hidden';
        
        if (skipBtn) {
            if (isMastered) skipBtn.classList.remove('hidden');
            else skipBtn.classList.add('hidden');
        }
        ansArea.focus();
    }
    saveQuizSession();
}

function submitAnswer() {
    const rawU = document.getElementById('quiz-answer').value;
    const item = quizList[currentIndex];
    const rawS = item.a;
    const feedback = document.getElementById('quiz-feedback');
    
    const cleanU = rawU.replace(/[\d０-９]+[\.．、]/g, '').replace(/[（）()、，。；：\s]/g, '');
    const cleanS = rawS.replace(/[\d０-９]+[\.．、]/g, '').replace(/[（）()、，。；：\s]/g, '');
    let isCorrect = cleanS.includes(cleanU) && cleanU.length >= 2;
    if (activeMatchRule === 'exact') {
        isCorrect = (rawU.trim() === rawS.trim());
    }

    if (!isCorrect) {
        wrongStats[item.id] = (wrongStats[item.id] || 0) + 1;
        saveAllData();
    }

    let feedbackHtmlContent = isCorrect ? `
        <div class="feedback-title">✅ 完全正確！</div>
        <div style="font-weight:600; margin-top:0.4rem;">【標準答案】：</div>
        <div class="diff-view">${escapeHtml(rawS)}</div>
    ` : `
        <div class="feedback-title">❌ 答案有誤</div>
        <div style="font-weight:600; margin-top:0.4rem;">【標準答案】：</div>
        <div class="diff-view">${escapeHtml(rawS)}</div>
        <div style="font-weight:600; margin-top:0.4rem;">【您的作答】：</div>
        <div class="diff-view">${escapeHtml(rawU)}</div>
    `;

    userAnswers[currentIndex] = { userAnswer: rawU, isSubmitted: true, isCorrect: isCorrect, feedbackHtml: feedbackHtmlContent };

    if (feedback) {
        feedback.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        feedback.innerHTML = feedbackHtmlContent;
        feedback.classList.remove('hidden');
    }
    document.getElementById('quiz-answer').disabled = true;
    document.getElementById('btn-submit').classList.add('hidden');
    document.getElementById('btn-next').classList.remove('hidden');
    saveQuizSession();
}

function saveCurrentDraft(val) {
    if (!userAnswers[currentIndex]) {
        userAnswers[currentIndex] = { userAnswer: val, isSubmitted: false };
    } else {
        userAnswers[currentIndex].userAnswer = val;
    }
    saveQuizSession();
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < quizList.length) showQuestion();
    else showResult();
}

function showResult() {
    isQuizActive = false;
    localStorage.removeItem('quiz_session_stage2');
    renderPauseBanner();

    document.getElementById('view-quiz').classList.add('hidden');
    document.getElementById('view-result').classList.remove('hidden');

    let actualAttempts = 0, correctCount = 0;
    userAnswers.forEach((ans) => {
        if (ans && ans.isSubmitted) {
            actualAttempts++;
            if (ans.isCorrect) correctCount++;
        }
    });

    const rate = actualAttempts > 0 ? Math.round((correctCount / actualAttempts) * 100) : 0;
    document.getElementById('res-rate').textContent = `${rate}%`;
    document.getElementById('res-detail').innerHTML = `實際作答 <strong>${actualAttempts}</strong> 題 ｜ 答對 <strong>${correctCount}</strong> 題`;
}

/* 🎴 智慧字卡系統（具備 SRS 智慧演算法） */
let currentFrontText = "";
let currentBackText = "";

function openFlashcardSetup() {
    document.getElementById('view-setup').classList.add('hidden');
    document.getElementById('view-quiz').classList.add('hidden');
    document.getElementById('view-mastered').classList.add('hidden');
    document.getElementById('view-result').classList.add('hidden');
    document.getElementById('view-flashcard').classList.remove('hidden');
    
    const scope = document.getElementById('select-card-scope').value || 'unmastered';
    changeCardScope(scope);
}

function changeCardScope(scope) {
    currentCardScope = scope;
    let pool = [];
    if (scope === 'all') pool = [...RAW_QUESTIONS];
    else if (scope === 'unmastered') pool = RAW_QUESTIONS.filter(q => !masteredSet.has(q.id));
    else if (scope === 'srs-smart') {
        pool = [...RAW_QUESTIONS].sort((a, b) => {
            const errA = wrongStats[a.id] || 0;
            const errB = wrongStats[b.id] || 0;
            const matA = masteredSet.has(a.id) ? 1 : 0;
            const matB = masteredSet.has(b.id) ? 1 : 0;
            if (matA !== matB) return matA - matB;
            return errB - errA;
        });
    }
    else if (scope === 'easy') pool = RAW_QUESTIONS.filter(q => q.diff === 'easy');
    else if (scope === 'mid') pool = RAW_QUESTIONS.filter(q => q.diff === 'mid');
    else if (scope === 'hard') pool = RAW_QUESTIONS.filter(q => q.diff === 'hard');

    if (pool.length === 0) {
        alert("🎉 此分類無題目，已自動切換至全部總題庫。");
        document.getElementById('select-card-scope').value = 'all';
        pool = [...RAW_QUESTIONS];
    }

    cardList = pool;
    cardIndex = cardLastPositions[scope] || 0;
    if (cardIndex >= cardList.length) cardIndex = 0;
    
    renderCardContent();
}

function restartFlashcards() {
    cardIndex = 0;
    cardLastPositions[currentCardScope] = 0;
    localStorage.setItem('card_last_positions_stage2', JSON.stringify(cardLastPositions));
    renderCardContent();
}

function renderCardContent() {
    if (cardList.length === 0) return;
    const item = cardList[cardIndex];
    isCardFlipped = false;
    
    cardLastPositions[currentCardScope] = cardIndex;
    localStorage.setItem('card_last_positions_stage2', JSON.stringify(cardLastPositions));

    const card = document.getElementById('flashcard-card');
    const inner = document.getElementById('flashcard-inner');
    if (card) {
        card.style.transition = 'none';
        card.style.transform = 'translate(0px, 0px) rotate(0deg)';
        card.style.opacity = '1';
    }
    if (inner) inner.classList.remove('is-flipped');
    const srs = document.getElementById('srs-box');
    if (srs) srs.classList.add('hidden');

    const prog = document.getElementById('card-progress');
    if (prog) prog.textContent = `📝 題目 (${cardIndex + 1}/${cardList.length}) (#${item.id})`;

    if (isReverseMode) {
        currentFrontText = item.a;
        currentBackText = item.q;
        document.getElementById('card-front-body').textContent = item.a;
        document.getElementById('card-back-body').textContent = item.q;
        document.getElementById('card-back-title').textContent = "💡 回想原題目";
    } else {
        currentFrontText = item.q;
        currentBackText = item.a;
        document.getElementById('card-front-body').textContent = item.q;
        document.getElementById('card-back-body').textContent = item.a;
        document.getElementById('card-back-title').textContent = "💡 標準答案";
    }

    const diffMap = { easy: { label: "易", class: "diff-tag-easy" }, mid: { label: "中", class: "diff-tag-mid" }, hard: { label: "難", class: "diff-tag-hard" } };
    const tag = document.getElementById('card-diff-tag');
    if (tag) {
        tag.className = `diff-tag ${diffMap[item.diff].class}`;
        tag.textContent = `${diffMap[item.diff].label} #${item.id}`;
    }

    const chk = document.getElementById('chk-card-mastered');
    if (chk) chk.checked = masteredSet.has(item.id);
    
    const prevBtn = document.getElementById('btn-card-prev');
    if (prevBtn) prevBtn.disabled = (cardIndex === 0);
}

function renderCardContentWithoutReset() {
    if (cardList.length === 0) return;
    const item = cardList[cardIndex];
    isCardFlipped = false;
    
    cardLastPositions[currentCardScope] = cardIndex;
    localStorage.setItem('card_last_positions_stage2', JSON.stringify(cardLastPositions));

    document.getElementById('srs-box').classList.add('hidden');
    document.getElementById('card-progress').textContent = `📝 題目 (${cardIndex + 1}/${cardList.length}) (#${item.id})`;

    if (isReverseMode) {
        currentFrontText = item.a;
        currentBackText = item.q;
        document.getElementById('card-front-body').textContent = item.a;
        document.getElementById('card-back-body').textContent = item.q;
        document.getElementById('card-back-title').textContent = "💡 回想原題目";
    } else {
        currentFrontText = item.q;
        currentBackText = item.a;
        document.getElementById('card-front-body').textContent = item.q;
        document.getElementById('card-back-body').textContent = item.a;
        document.getElementById('card-back-title').textContent = "💡 標準答案";
    }

    const chk = document.getElementById('chk-card-mastered');
    if (chk) chk.checked = masteredSet.has(item.id);
    
    const prevBtn = document.getElementById('btn-card-prev');
    if (prevBtn) prevBtn.disabled = (cardIndex === 0);
}

function flipCard() {
    const now = Date.now();
    if (now < suppressClickUntil) return;
    suppressClickUntil = now + 250;

    isCardFlipped = !isCardFlipped;
    const inner = document.getElementById('flashcard-inner');
    const srs = document.getElementById('srs-box');
    if (isCardFlipped) {
        if (inner) inner.classList.add('is-flipped');
        if (srs) srs.classList.remove('hidden');
    } else {
        if (inner) inner.classList.remove('is-flipped');
        if (srs) srs.classList.add('hidden');
    }
}

function rateCard(level) {
    const item = cardList[cardIndex];
    if (level === 'hard') {
        wrongStats[item.id] = (wrongStats[item.id] || 0) + 1;
        masteredSet.delete(item.id);
    } else if (level === 'easy') {
        masteredSet.add(item.id);
    }
    saveAllData();
    nextCard();
}

function animateSlideTo(direction, targetIndex) {
    const card = document.getElementById('flashcard-card');
    if (!card) { cardIndex = targetIndex; renderCardContent(); return; }
    const flyOutX = (direction === 'left') ? -window.innerWidth * 1.2 : window.innerWidth * 1.2;
    
    card.style.transition = 'transform 0.2s ease-in, opacity 0.2s ease-in';
    card.style.transform = `translate(${flyOutX}px, 0px) rotate(${direction === 'left' ? -15 : 15}deg)`;
    card.style.opacity = '0';

    setTimeout(() => {
        cardIndex = targetIndex;
        renderCardContentWithoutReset();

        const flyInStartX = (direction === 'left') ? window.innerWidth * 1.2 : -window.innerWidth * 1.2;
        card.style.transition = 'none';
        card.style.transform = `translate(${flyInStartX}px, 0px) rotate(0deg)`;
        card.style.opacity = '0';

        card.getBoundingClientRect();

        requestAnimationFrame(() => {
            card.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.25), opacity 0.25s ease';
            card.style.transform = 'translate(0px, 0px) rotate(0deg)';
            card.style.opacity = '1';
        });
    }, 200);
}

function nextCard() {
    if (cardIndex < cardList.length - 1) {
        document.getElementById('srs-box').classList.add('hidden');
        animateSlideTo('left', cardIndex + 1);
    } else {
        alert("🎉 本題庫字卡已全部背誦完畢！");
        exitFlashcards();
    }
}

function prevCard() {
    if (cardIndex > 0) {
        document.getElementById('srs-box').classList.add('hidden');
        animateSlideTo('right', cardIndex - 1);
    }
}

function exitFlashcards() {
    if (autoPlayInterval) toggleAutoPlay();
    document.getElementById('view-flashcard').classList.add('hidden');
    document.getElementById('view-setup').classList.remove('hidden');
    renderDashboard();
}

function toggleAutoPlay() {
    const btn = document.getElementById('btn-autoplay');
    if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        btn.innerHTML = '<span>⏱️ 輪播</span>';
        btn.classList.remove('active');
    } else {
        btn.innerHTML = '<span>⏹️ 停止</span>';
        btn.classList.add('active');
        autoPlayInterval = setInterval(() => {
            if (!isCardFlipped) {
                flipCard();
            } else {
                nextCard();
            }
        }, 3600);
    }
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
    } else {
        alert("您的瀏覽器不支援語音朗讀功能！");
    }
}

/* 👆 字卡區域互動 */
const cardEl = document.getElementById('flashcard-card');
let isDragging = false, startX = 0, startY = 0, currentX = 0, currentY = 0, isMoved = false;

if (cardEl) {
    cardEl.addEventListener('touchstart', (e) => {
        if (e.target.closest('button') || e.target.closest('input')) return;
        isDragging = true; isMoved = false;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        currentX = startX; currentY = startY;
        cardEl.style.transition = 'none';
    }, { passive: true });

    cardEl.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
        const deltaX = currentX - startX;
        if (Math.abs(deltaX) > 8 || Math.abs(currentY - startY) > 8) isMoved = true;
        cardEl.style.transform = `translate(${deltaX}px, ${(currentY - startY) * 0.25}px) rotate(${deltaX * 0.05}deg)`;
    }, { passive: true });

    cardEl.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        const deltaX = currentX - startX;
        if (Math.abs(deltaX) > 75) {
            suppressClickUntil = Date.now() + 350;
            document.getElementById('srs-box').classList.add('hidden');
            if (deltaX < 0 && cardIndex < cardList.length - 1) {
                animateSlideTo('left', cardIndex + 1);
            } else if (deltaX > 0 && cardIndex > 0) {
                animateSlideTo('right', cardIndex - 1);
            } else {
                springBack();
            }
        } else {
            if (!isMoved) handleCardAreaClick(currentX);
            else springBack();
        }
    });

    cardEl.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('input')) return;
        handleCardAreaClick(e.clientX);
    });
}

function handleCardAreaClick(clientX) {
    const rect = cardEl.getBoundingClientRect();
    const clickX = clientX - rect.left;
    const width = rect.width;

    if (clickX < width * 0.25) {
        prevCard();
    } else if (clickX > width * 0.75) {
        nextCard();
    } else {
        flipCard();
    }
}

function springBack() {
    cardEl.style.transition = 'transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.25), opacity 0.25s ease';
    cardEl.style.transform = 'translate(0px, 0px) rotate(0deg)';
    cardEl.style.opacity = '1';
}

/* 📖 總題庫瀏覽 */
function showMasteredList() {
    document.getElementById('view-setup').classList.add('hidden');
    document.getElementById('view-mastered').classList.remove('hidden');
    renderMasteredList();
}

function hideMasteredList() {
    document.getElementById('view-mastered').classList.add('hidden');
    document.getElementById('view-setup').classList.remove('hidden');
    renderDashboard();
}

function switchBankFilter(filter) {
    currentBankFilter = filter;
    ['tab-all', 'tab-unmastered', 'tab-mastered'].forEach(id => document.getElementById(id)?.classList.remove('active'));
    document.getElementById(`tab-${filter}`)?.classList.add('active');
    renderMasteredList();
}

function renderMasteredList() {
    const container = document.getElementById('mastered-list-container');
    if (!container) return;
    let displayList = RAW_QUESTIONS;
    if (currentBankFilter === 'mastered') displayList = RAW_QUESTIONS.filter(q => masteredSet.has(q.id));
    else if (currentBankFilter === 'unmastered') displayList = RAW_QUESTIONS.filter(q => !masteredSet.has(q.id));

    const diffMap = { easy: { label: "易", class: "diff-tag-easy" }, mid: { label: "中", class: "diff-tag-mid" }, hard: { label: "難", class: "diff-tag-hard" } };

    container.innerHTML = displayList.map(item => {
        const isM = masteredSet.has(item.id);
        return `
            <div class="mastered-item-card ${isM ? 'is-mastered' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                    <div>
                        <span class="diff-tag ${diffMap[item.diff].class}">${diffMap[item.diff].label}</span>
                        <strong style="margin-left:0.35rem; font-size:0.85rem; color:var(--text-muted);">#${item.id}</strong>
                    </div>
                    <label class="mastered-toggle no-print" style="font-size:0.82rem;">
                        <input type="checkbox" ${isM ? 'checked' : ''} onchange="toggleMasteredFromBank(${item.id}, this.checked)">
                        <span>熟記</span>
                    </label>
                </div>
                <div style="font-weight:600; font-size:0.95rem; margin-bottom:0.4rem;">${escapeHtml(item.q)}</div>
                <div style="font-size:0.9rem; color:#334155; background:#f8fafc; padding:0.5rem; border-left:3px solid var(--primary); border-radius:4px; white-space: pre-wrap;">${escapeHtml(item.a)}</div>
            </div>
        `;
    }).join('');
}

function toggleMasteredFromBank(qId, isChecked) {
    if (isChecked) masteredSet.add(qId);
    else masteredSet.delete(qId);
    saveAllData();
    renderMasteredList();
}

/* 🔗 事件綁定 */
document.addEventListener('DOMContentLoaded', () => {
    renderDashboard();
    renderStreakBadge();
    handleModeChange();
    renderPauseBanner();

    const bindClick = (id, fn) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', fn);
    };

    bindClick('btn-start-quiz', startQuiz);
    bindClick('btn-open-flashcard', openFlashcardSetup);
    bindClick('btn-show-mastered', showMasteredList);
    bindClick('btn-hide-mastered', hideMasteredList);
    bindClick('btn-submit', submitAnswer);
    bindClick('btn-next', nextQuestion);
    bindClick('btn-prev', () => { if (currentIndex > 0) { currentIndex--; showQuestion(); } });
    bindClick('btn-skip', () => { nextQuestion(); });
    bindClick('btn-pause-quiz', pauseAndGoHome);
    bindClick('btn-exit-flashcard', exitFlashcards);
    bindClick('btn-card-flip', flipCard);
    bindClick('btn-card-next', nextCard);
    bindClick('btn-card-prev', prevCard);
    bindClick('btn-card-restart', restartFlashcards);
    bindClick('btn-autoplay', toggleAutoPlay);
    
    bindClick('srs-easy', () => rateCard('easy'));
    bindClick('srs-mid', () => nextCard());
    bindClick('srs-hard', () => rateCard('hard'));

    bindClick('btn-speak-front', () => speakText(currentFrontText));
    bindClick('btn-speak-back', () => speakText(currentBackText));

    const chkRev = document.getElementById('chk-reverse');
    if (chkRev) chkRev.addEventListener('change', (e) => { isReverseMode = e.target.checked; renderCardContent(); });

    const chkCardM = document.getElementById('chk-card-mastered');
    if (chkCardM) chkCardM.addEventListener('change', (e) => {
        if (!cardList[cardIndex]) return;
        const qId = cardList[cardIndex].id;
        if (e.target.checked) masteredSet.add(qId);
        else masteredSet.delete(qId);
        saveAllData();
    });

    bindClick('btn-show-backup', () => {
        const data = { mastered: [...masteredSet], wrong: wrongStats };
        const txt = document.getElementById('txt-backup');
        if (txt) txt.value = btoa(encodeURIComponent(JSON.stringify(data)));
        document.getElementById('modal-backup')?.classList.remove('hidden');
    });
    bindClick('btn-close-backup', () => document.getElementById('modal-backup')?.classList.add('hidden'));
    bindClick('btn-reset-data', () => {
        if (confirm("確定要重設所有已熟記標記與錯題嗎？")) {
            masteredSet.clear();
            wrongStats = {};
            localStorage.removeItem('quiz_session_stage2');
            saveAllData();
            renderDashboard();
            renderPauseBanner();
        }
    });

    bindClick('btn-restart-quiz', () => {
        document.getElementById('view-result').classList.add('hidden');
        document.getElementById('view-setup').classList.remove('hidden');
    });
});
</script>
</body>
</html>
